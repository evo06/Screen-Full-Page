<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScreenSnap</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <img src="../icons/icon32.png" alt="ScreenSnap" class="logo" />
        <div>
          <h1>ScreenSnap</h1>
          <p id="hostLabel" class="host">Pronto para capturar</p>
        </div>
      </div>
    </header>

    <div id="errorBanner" class="error-banner hidden" role="alert"></div>

    <main class="actions">
      <button id="btnSelection" class="action-btn" data-mode="selection">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 3a2 2 0 0 0-2 2v2M19 3a2 2 0 0 1 2 2v2M5 21a2 2 0 0 1-2-2v-2M19 21a2 2 0 0 0 2-2v-2"/>
            <rect x="7" y="7" width="10" height="10" rx="1" stroke-dasharray="3 2"/>
          </svg>
        </span>
        <span class="text-wrap">
          <strong>Área selecionada</strong>
          <small>Arraste para capturar parte da tela</small>
        </span>
        <kbd>Alt+Shift+2</kbd>
      </button>

      <button id="btnVisible" class="action-btn" data-mode="visible">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M3 9h18"/>
          </svg>
        </span>
        <span class="text-wrap">
          <strong>Parte visível</strong>
          <small>Captura apenas o que está na janela</small>
        </span>
        <kbd>Alt+Shift+1</kbd>
      </button>

      <button id="btnFullpage" class="action-btn" data-mode="fullpage">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2"/>
            <path d="M8 7h8M8 12h8M8 17h5"/>
          </svg>
        </span>
        <span class="text-wrap">
          <strong>Página inteira</strong>
          <small>Rola e costura a página completa</small>
        </span>
        <kbd>Alt+Shift+3</kbd>
      </button>
    </main>

    <section class="delay-row" aria-label="Atraso antes da captura">
      <span class="delay-label">Atraso:</span>
      <div class="delay-pills" role="group">
        <button class="delay-pill active" data-delay="0">0s</button>
        <button class="delay-pill" data-delay="3">3s</button>
        <button class="delay-pill" data-delay="5">5s</button>
      </div>
    </section>

    <footer class="footer">
      <button id="btnShortcuts" class="link-btn" type="button">Configurar atalhos</button>
      <span class="hint">Esc cancela a captura</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
